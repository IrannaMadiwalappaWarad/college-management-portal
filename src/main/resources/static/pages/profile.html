<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - EduDash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
    <link href="../css/responsive.css" rel="stylesheet">
    <link href="../css/components.css" rel="stylesheet">
</head>
<body>

    <div id="toast-container" class="toast-container"></div>

    <div class="dashboard-wrapper">
        <!-- Sidebar (Dynamically built based on role in JS) -->
        <aside class="sidebar" id="dynamicSidebar">
            <div class="sidebar-header d-flex justify-content-between align-items-center">
                <a href="#" class="sidebar-brand">
                    <i class="bi bi-mortarboard-fill me-2"></i>EduDash
                </a>
                <i class="bi bi-x-lg mobile-nav-toggle" id="closeSidebar"></i>
            </div>
            <ul class="sidebar-menu" id="sidebarMenuLinks">
                <!-- Links injected via JS -->
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn" class="sidebar-link text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="d-flex align-items-center">
                    <i class="bi bi-list mobile-nav-toggle me-3" id="openSidebar"></i>
                    <h5 class="mb-0 fw-bold d-none d-sm-block">Account Settings</h5>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" data-bs-toggle="dropdown">
                            <img src="https://ui-avatars.com/api/?name=User&background=6655D9&color=fff" id="topbarAvatar" width="40" height="40" class="rounded-circle me-2">
                            <div class="d-none d-md-block text-start">
                                <span class="d-block fw-semibold" id="topbarName">User</span>
                                <small class="text-muted" id="topbarRole" style="font-size: 0.75rem;">Role</small>
                            </div>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                            <li><a class="dropdown-item active" href="profile.html"><i class="bi bi-person me-2"></i> Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="dropdownLogout"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="container-fluid p-4">
                <div class="row g-4">
                    <!-- Profile Card -->
                    <div class="col-12 col-xl-4">
                        <div class="edu-card text-center pb-4">
                            <div class="position-relative d-inline-block mb-3 mt-3">
                                <img src="https://ui-avatars.com/api/?name=User&background=6655D9&color=fff&size=120" id="profileLargeAvatar" class="rounded-circle shadow-sm" alt="Profile">
                                <button class="btn btn-sm btn-light rounded-circle position-absolute bottom-0 end-0 shadow border"><i class="bi bi-camera-fill text-primary"></i></button>
                            </div>
                            <h4 class="fw-bold mb-1" id="profileEmail">Loading...</h4>
                            <p class="text-muted mb-3" id="profileRoleBadge">--</p>
                            <hr class="my-4 text-muted">
                            <div class="d-flex justify-content-between px-3 text-start mb-2">
                                <span class="text-muted fw-medium small">Status</span>
                                <span class="badge bg-light-success text-success border-0 px-2 py-1">ACTIVE</span>
                            </div>
                            <div class="d-flex justify-content-between px-3 text-start">
                                <span class="text-muted fw-medium small">Member Since</span>
                                <span class="fw-semibold small">2023</span>
                            </div>
                        </div>
                    </div>

                    <!-- Settings Form -->
                    <div class="col-12 col-xl-8">
                        <div class="edu-card">
                            <h5 class="mb-4 fw-bold">Personal Information</h5>
                            <form id="profileForm">
                                <div class="row g-4 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">Email Address (Read Only)</label>
                                        <input type="email" class="form-control bg-light" id="inputEmail" readonly>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">Role (Read Only)</label>
                                        <input type="text" class="form-control bg-light" id="inputRole" readonly>
                                    </div>
                                </div>
                                
                                <h5 class="mb-4 fw-bold pt-3 border-top">Change Password</h5>
                                <div class="row g-4">
                                    <div class="col-md-12">
                                        <label class="form-label fw-medium">Current Password</label>
                                        <input type="password" class="form-control" id="currentPassword" placeholder="Enter current password">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">New Password</label>
                                        <input type="password" class="form-control" id="newPassword" placeholder="Enter new password">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">Confirm New Password</label>
                                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password">
                                    </div>
                                </div>
                                <div class="mt-4 text-end">
                                    <button type="button" class="btn btn-primary px-4" id="saveProfileBtn">Save Changes</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = auth.getToken();
            const role = auth.getRole();
            
            if (!token) {
                window.location.href = '../login.html';
                return;
            }

            // Authentication & UI Population
            const email = localStorage.getItem('user_email') || 'User@college.edu'; // Stored during login in api.js/auth.js ideal implementation
            
            document.getElementById('profileEmail').innerText = email;
            document.getElementById('inputEmail').value = email;
            document.getElementById('profileRoleBadge').innerHTML = `<span class="badge bg-primary bg-opacity-10 text-primary">${role}</span>`;
            document.getElementById('inputRole').value = role;
            
            document.getElementById('topbarName').innerText = email.split('@')[0];
            document.getElementById('topbarRole').innerText = role;

            // Mobile Sidebar Toggle Logic
            const sidebar = document.getElementById('dynamicSidebar');
            document.getElementById('openSidebar').addEventListener('click', () => sidebar.classList.add('show'));
            document.getElementById('closeSidebar').addEventListener('click', () => sidebar.classList.remove('show'));

            // Build Sidebar Links Based on Role
            const menuLinks = document.getElementById('sidebarMenuLinks');
            if (role === 'ADMIN') {
                menuLinks.innerHTML = `
                    <li class="sidebar-item"><a href="admin-dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
                    <li class="sidebar-item"><a href="students.html" class="sidebar-link"><i class="bi bi-people"></i> Students</a></li>
                    <li class="sidebar-item"><a href="faculty.html" class="sidebar-link"><i class="bi bi-person-workspace"></i> Faculty</a></li>
                    <li class="sidebar-item"><a href="attendance.html" class="sidebar-link"><i class="bi bi-calendar-check"></i> Attendance</a></li>
                    <li class="sidebar-item"><a href="notices.html" class="sidebar-link"><i class="bi bi-megaphone"></i> Notices</a></li>
                `;
            } else if (role === 'FACULTY') {
                menuLinks.innerHTML = `
                    <li class="sidebar-item"><a href="faculty-dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
                    <li class="sidebar-item"><a href="attendance.html" class="sidebar-link"><i class="bi bi-calendar-check"></i> Mark Attendance</a></li>
                `;
            } else {
                menuLinks.innerHTML = `
                    <li class="sidebar-item"><a href="student-dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i> My Dashboard</a></li>
                `;
            }
            menuLinks.innerHTML += `<li class="sidebar-item mt-4"><a href="profile.html" class="sidebar-link active"><i class="bi bi-person-gear"></i> Profile Settings</a></li>`;

            // Logout Event Listeners
            const logout = () => { auth.clear(); window.location.href = '../login.html'; };
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('dropdownLogout').addEventListener('click', logout);

            // Mock Save Button (Since backend user update API isn't built yet)
            document.getElementById('saveProfileBtn').addEventListener('click', () => {
                const p1 = document.getElementById('newPassword').value;
                const p2 = document.getElementById('confirmPassword').value;
                
                if (p1 && p1 !== p2) {
                    showToast('New passwords do not match!', 'error');
                    return;
                }
                
                showToast('Settings saved successfully!');
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            });
        });
    </script>
</body>
</html>
