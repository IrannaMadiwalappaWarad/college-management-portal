<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard - EduDash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <div class="dashboard-wrapper">
        <!-- Faculty Sidebar (Restricted Options) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="faculty-dashboard.html" class="sidebar-brand">
                    <i class="bi bi-mortarboard-fill me-2"></i>EduDash
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="faculty-dashboard.html" class="sidebar-link active"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                </li>
                <li class="sidebar-item">
                    <!-- FIXED: Now points to the dedicated faculty attendance page -->
                    <a href="faculty-attendance.html" class="sidebar-link"><i class="bi bi-calendar-check"></i> Mark Attendance</a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn" class="sidebar-link text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="search-bar"></div> <!-- Empty for spacing -->
                <div class="d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" data-bs-toggle="dropdown">
                            <img src="https://ui-avatars.com/api/?name=Faculty&background=4C83F5&color=fff" id="topbarAvatar" width="40" height="40" class="rounded-circle me-2">
                            <div class="d-none d-md-block text-start">
                                <span class="d-block fw-semibold" id="topbarName">Loading...</span>
                                <small class="text-muted" style="font-size: 0.75rem;">Faculty Member</small>
                            </div>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i> My Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="dropdownLogout"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="container-fluid p-4">
                <div class="row g-4 mb-4">
                    <div class="col-12">
                        <div class="edu-card d-flex flex-column justify-content-center bg-secondary text-white" style="border: none;">
                            <h3 class="fw-bold mb-1">Welcome to the Faculty Portal!</h3>
                            <p class="mb-4 text-white-50">Manage your classes, mark attendance, and stay updated with campus news.</p>
                            <!-- FIXED: Now points to the dedicated faculty attendance page -->
                            <a href="faculty-attendance.html" class="btn btn-light align-self-start fw-semibold text-secondary">Mark Attendance Now</a>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-12 col-xl-8">
                        <div class="edu-card h-100">
                            <h5 class="mb-4">Active Notices & Announcements</h5>
                            <div class="notice-list pe-2" id="facultyNoticeList">
                                <div class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm me-2"></div> Loading...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Security Check
            if (!auth.getToken() || auth.getRole() !== 'FACULTY') {
                auth.clear();
                window.location.href = '../login.html';
                return;
            }

            // Populate Faculty Name in Topbar
            const email = localStorage.getItem('user_email') || 'faculty@college.edu';
            const namePrefix = email.split('@')[0];
            document.getElementById('topbarName').innerText = namePrefix;
            document.getElementById('topbarAvatar').src = `https://ui-avatars.com/api/?name=${namePrefix}&background=4C83F5&color=fff`;

            // Logout Logic
            const logout = () => { auth.clear(); window.location.href = '../login.html'; };
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('dropdownLogout').addEventListener('click', logout);

            // Fetch Notices
            try {
                const notices = await api.getActiveNotices();
                const container = document.getElementById('facultyNoticeList');
                container.innerHTML = '';
                
                let found = false;
                notices.forEach(n => {
                    if(n.audience === 'FACULTY' || n.audience === 'ALL') {
                        found = true;
                        container.innerHTML += `
                            <div class="notice-item event">
                                <h6>${n.title} <span class="badge bg-light text-secondary ms-2">${n.category}</span></h6>
                                <p class="text-muted small">${n.description}</p>
                            </div>
                        `;
                    }
                });

                if(!found) {
                    container.innerHTML = '<p class="text-muted">No active notices for faculty.</p>';
                }
            } catch (err) {
                console.error("Error loading notices:", err);
            }
        });
    </script>
</body>
</html>
