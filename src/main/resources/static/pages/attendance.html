<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management - EduDash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
    <style>
        /* Custom styles for Attendance Radio Buttons */
        .attendance-radio .btn {
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="toast-container" class="toast-container"></div>

    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="admin-dashboard.html" class="sidebar-brand">
                    <i class="bi bi-mortarboard-fill me-2"></i>EduDash
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="admin-dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                </li>
                <li class="sidebar-item">
                    <a href="students.html" class="sidebar-link"><i class="bi bi-people"></i> Students</a>
                </li>
                <li class="sidebar-item">
                    <a href="faculty.html" class="sidebar-link"><i class="bi bi-person-workspace"></i> Faculty</a>
                </li>
                <li class="sidebar-item">
                    <a href="attendance.html" class="sidebar-link active"><i class="bi bi-calendar-check"></i> Attendance</a>
                </li>
                <li class="sidebar-item">
                    <a href="notices.html" class="sidebar-link"><i class="bi bi-megaphone"></i> Notices</a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn" class="sidebar-link text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="search-bar">
                    <i class="bi bi-search"></i>
                    <input type="text" class="form-control" placeholder="Search...">
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" data-bs-toggle="dropdown">
                            <img src="https://ui-avatars.com/api/?name=Admin+User&background=6655D9&color=fff" alt="User" width="40" height="40" class="rounded-circle me-2">
                            <div class="d-none d-md-block text-start">
                                <span class="d-block fw-semibold" id="topbarName">Admin User</span>
                                <small class="text-muted" style="font-size: 0.75rem;">Administrator</small>
                            </div>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                            <li><a class="dropdown-item text-danger" href="#" id="dropdownLogout"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="container-fluid p-4">
                <h4 class="mb-4 fw-bold">Mark Attendance</h4>

                <!-- Filter Card -->
                <div class="edu-card mb-4">
                    <form id="attendanceFilterForm">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-2">
                                <label class="form-label fw-medium small">Date</label>
                                <input type="date" class="form-control" id="attendanceDate" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-medium small">Faculty</label>
                                <select class="form-control" id="facultySelect" required>
                                    <option value="">Select Faculty...</option>
                                    <!-- Populated via JS -->
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-medium small">Department</label>
                                <select class="form-control" id="deptSelect" required>
                                    <option value="">Select Dept</option>
                                    <option value="CSE">CSE</option>
                                    <option value="ISE">ISE</option>
                                    <option value="ECE">ECE</option>
                                    <option value="ME">ME</option>
                                    <option value="CV">CV</option>
                                </select>
                            </div>
                            <div class="col-md-1">
                                <label class="form-label fw-medium small">Sem</label>
                                <select class="form-control" id="semSelect" required>
                                    <option value="">Sem</option>
                                    <option value="1">1</option><option value="2">2</option>
                                    <option value="3">3</option><option value="4">4</option>
                                    <option value="5">5</option><option value="6">6</option>
                                    <option value="7">7</option><option value="8">8</option>
                                </select>
                            </div>
                            <div class="col-md-1">
                                <label class="form-label fw-medium small">Sec</label>
                                <select class="form-control" id="secSelect" required>
                                    <option value="">Sec</option>
                                    <option value="A">A</option><option value="B">B</option>
                                    <option value="C">C</option><option value="D">D</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-medium small">Subject</label>
                                <select class="form-control" id="subjectName" required>
                                    <option value="">Select Dept & Sem first...</option>
                                </select>
                            </div>
                            <div class="col-md-1">
                                <button type="submit" class="btn btn-primary w-100" id="loadStudentsBtn">Load</button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Students List Card (Hidden until loaded) -->
                <div class="edu-card" id="attendanceListCard" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0">Student List</h5>
                        <button class="btn btn-success px-4" id="submitAttendanceBtn">
                            <i class="bi bi-check2-circle me-1"></i> Submit Attendance
                        </button>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-muted">
                                <tr>
                                    <th>USN</th>
                                    <th>Student Name</th>
                                    <th class="text-center">Mark Status</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceTableBody">
                                <!-- Populated via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/attendance.js"></script>
</body>
</html>
