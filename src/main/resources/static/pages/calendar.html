<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Calendar - EduDash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- FullCalendar CSS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js'></script>
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
    <style>
        .fc-toolbar-title { font-size: 1.25rem !important; font-weight: 700; color: var(--text-main); }
        .fc-button-primary { background-color: var(--primary-color) !important; border-color: var(--primary-color) !important; }
        .fc-event { cursor: pointer; border-radius: 4px; padding: 2px 4px; border: none; }
        .bg-event-exam { background-color: var(--danger-color) !important; color: white; }
        .bg-event-holiday { background-color: var(--success-color) !important; color: white; }
        .bg-event-general { background-color: var(--primary-color) !important; color: white; }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="dynamicSidebar">
            <div class="sidebar-header d-flex justify-content-between align-items-center">
                <a href="admin-dashboard.html" class="sidebar-brand">
                    <i class="bi bi-mortarboard-fill me-2"></i>EduDash
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item"><a href="admin-dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
                <li class="sidebar-item"><a href="students.html" class="sidebar-link"><i class="bi bi-people"></i> Students</a></li>
                <li class="sidebar-item"><a href="faculty.html" class="sidebar-link"><i class="bi bi-person-workspace"></i> Faculty</a></li>
                <li class="sidebar-item"><a href="notices.html" class="sidebar-link"><i class="bi bi-megaphone"></i> Notices</a></li>
                <li class="sidebar-item"><a href="calendar.html" class="sidebar-link active"><i class="bi bi-calendar3"></i> Calendar</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h5 class="mb-0 fw-bold">Academic Calendar</h5>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light rounded-circle"><i class="bi bi-bell"></i></button>
                    <img src="https://ui-avatars.com/api/?name=User&background=6655D9&color=fff" width="40" height="40" class="rounded-circle">
                </div>
            </header>

            <div class="container-fluid p-4">
                <div class="edu-card">
                    <div id="calendar"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!auth.getToken()) window.location.href = '../login.html';

            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: [
                    // Mock Data: In a real app, you would fetch this from the backend
                    { title: 'Mid-Term Exams', start: '2023-11-15', end: '2023-11-20', className: 'bg-event-exam' },
                    { title: 'Thanksgiving Holiday', start: '2023-11-23', className: 'bg-event-holiday' },
                    { title: 'Tech Symposium', start: '2023-11-28', className: 'bg-event-general' }
                ]
            });
            calendar.render();
        });
    </script>
</body>
</html>
