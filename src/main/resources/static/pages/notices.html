<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Management - EduDash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>

    <div id="toast-container" class="toast-container"></div>

    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="admin-dashboard.html" class="sidebar-brand">
                    <i class="bi bi-mortarboard-fill me-2"></i>EduDash
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="admin-dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                </li>
                <li class="sidebar-item">
                    <a href="students.html" class="sidebar-link"><i class="bi bi-people"></i> Students</a>
                </li>
                <li class="sidebar-item">
                    <a href="faculty.html" class="sidebar-link"><i class="bi bi-person-workspace"></i> Faculty</a>
                </li>
                <li class="sidebar-item">
                    <a href="attendance.html" class="sidebar-link"><i class="bi bi-calendar-check"></i> Attendance</a>
                </li>
                <li class="sidebar-item">
                    <a href="notices.html" class="sidebar-link active"><i class="bi bi-megaphone"></i> Notices</a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn" class="sidebar-link text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="search-bar">
                    <i class="bi bi-search"></i>
                    <input type="text" id="globalSearch" class="form-control" placeholder="Search notices by title...">
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" data-bs-toggle="dropdown">
                            <img src="https://ui-avatars.com/api/?name=Admin+User&background=6655D9&color=fff" alt="User" width="40" height="40" class="rounded-circle me-2">
                            <div class="d-none d-md-block text-start">
                                <span class="d-block fw-semibold">Admin User</span>
                                <small class="text-muted" style="font-size: 0.75rem;">Administrator</small>
                            </div>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                            <li><a class="dropdown-item text-danger" href="#" id="dropdownLogout"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="container-fluid p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0 fw-bold">Notice Management</h4>
                    <button class="btn btn-primary" onclick="openNoticeModal()">
                        <i class="bi bi-plus-lg me-1"></i> Create Notice
                    </button>
                </div>

                <div class="edu-card">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-muted">
                                <tr>
                                    <th>Title & Description</th>
                                    <th>Category</th>
                                    <th>Audience</th>
                                    <th>Publish Date</th>
                                    <th>Expiry Date</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="noticeTableBody">
                                <tr>
                                    <td colspan="7" class="text-center py-4 text-muted">
                                        <div class="spinner-border spinner-border-sm me-2"></div> Loading notices...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Notice Modal -->
    <div class="modal fade" id="noticeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modalTitle">Create New Notice</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="noticeForm">
                        <input type="hidden" id="noticeId">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-medium">Notice Title</label>
                                <input type="text" class="form-control" id="title" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-medium">Description</label>
                                <textarea class="form-control" id="description" rows="3" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Category</label>
                                <select class="form-control" id="category" required>
                                    <option value="">Select Category</option>
                                    <option value="Academic">Academic</option>
                                    <option value="Examination">Examination</option>
                                    <option value="Events">Events</option>
                                    <option value="General">General</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Audience</label>
                                <select class="form-control" id="audience" required>
                                    <option value="">Select Audience</option>
                                    <option value="ALL">ALL</option>
                                    <option value="STUDENTS">STUDENTS</option>
                                    <option value="FACULTY">FACULTY</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Publish Date & Time</label>
                                <input type="datetime-local" class="form-control" id="publishDate" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Expiry Date & Time</label>
                                <input type="datetime-local" class="form-control" id="expiryDate" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Published By</label>
                                <input type="text" class="form-control" id="publishedBy" value="Admin Office" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Status</label>
                                <select class="form-control" id="status" required>
                                    <option value="ACTIVE">ACTIVE</option>
                                    <option value="INACTIVE">INACTIVE</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveNoticeBtn">Save Notice</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/notices.js"></script>
</body>
</html>
