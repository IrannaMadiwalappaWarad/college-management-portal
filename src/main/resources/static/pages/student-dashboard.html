<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - EduDash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <div class="dashboard-wrapper">
        <!-- Student Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="student-dashboard.html" class="sidebar-brand">
                    <i class="bi bi-mortarboard-fill me-2"></i>EduDash
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="student-dashboard.html" class="sidebar-link active"><i class="bi bi-grid-1x2"></i> My Dashboard</a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn" class="sidebar-link text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="search-bar"></div>
                <div class="d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" data-bs-toggle="dropdown">
                            <img src="https://ui-avatars.com/api/?name=Student&background=27AE75&color=fff" alt="Student" width="40" height="40" class="rounded-circle me-2">
                            <div class="d-none d-md-block text-start">
                                <span class="d-block fw-semibold">Student Portal</span>
                            </div>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                            <li><a class="dropdown-item text-danger" href="#" id="dropdownLogout"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="container-fluid p-4">
                
                <!-- Connect USN Card -->
                <div class="edu-card bg-primary bg-opacity-10 border-0 mb-4" id="usnPromptCard">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h5 class="fw-bold text-primary mb-1">View Your Academic Data</h5>
                            <p class="text-muted mb-0 small">Enter your USN to load your attendance and academic profile.</p>
                        </div>
                        <div class="d-flex gap-2">
                            <input type="text" id="studentUsnInput" class="form-control" placeholder="Enter USN (e.g. 1RV21CS001)">
                            <button class="btn btn-primary" id="loadProfileBtn">Load</button>
                        </div>
                    </div>
                </div>

                <!-- Hidden Academic Profile (Shows after USN load) -->
                <div id="academicProfile" style="display: none;">
                    <div class="row g-4 mb-4">
                        <div class="col-md-4">
                            <div class="edu-card stat-card h-100">
                                <div class="stat-icon bg-light-primary"><i class="bi bi-percent"></i></div>
                                <div>
                                    <h4 class="mb-0 fw-bold" id="stuPercentage">--%</h4>
                                    <span class="text-muted small">Overall Attendance</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="edu-card stat-card h-100">
                                <div class="stat-icon bg-light-success"><i class="bi bi-check-circle"></i></div>
                                <div>
                                    <h4 class="mb-0 fw-bold" id="stuPresent">--</h4>
                                    <span class="text-muted small">Classes Attended</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="edu-card stat-card h-100">
                                <div class="stat-icon bg-light-danger"><i class="bi bi-x-circle"></i></div>
                                <div>
                                    <h4 class="mb-0 fw-bold" id="stuAbsent">--</h4>
                                    <span class="text-muted small">Classes Missed</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Notices -->
                <div class="row g-4">
                    <div class="col-12">
                        <div class="edu-card h-100">
                            <h5 class="mb-4">College Notices</h5>
                            <div class="notice-list pe-2" id="studentNoticeList"></div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!auth.getToken() || auth.getRole() !== 'STUDENT') {
                auth.clear();
                window.location.href = '../login.html';
                return;
            }

            const logout = () => { auth.clear(); window.location.href = '../login.html'; };
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('dropdownLogout').addEventListener('click', logout);

            // Load Notices
            try {
                const notices = await api.getActiveNotices();
                const container = document.getElementById('studentNoticeList');
                container.innerHTML = '';
                
                notices.forEach(n => {
                    if(n.audience === 'STUDENTS' || n.audience === 'ALL') {
                        container.innerHTML += `
                            <div class="notice-item exam">
                                <h6>${n.title} <span class="badge bg-light text-secondary ms-2">${n.category}</span></h6>
                                <p class="text-muted small">${n.description}</p>
                            </div>
                        `;
                    }
                });
            } catch (err) {
                console.error(err);
            }

            // Load Attendance Profile
            document.getElementById('loadProfileBtn').addEventListener('click', async () => {
                const usn = document.getElementById('studentUsnInput').value.trim().toUpperCase();
                if(!usn) return;

                const btn = document.getElementById('loadProfileBtn');
                btn.innerHTML = 'Loading...';
                
                try {
                    const summary = await api.getAttendanceSummary(usn);
                    
                    document.getElementById('stuPercentage').innerText = summary.attendancePercentage + '%';
                    document.getElementById('stuPresent').innerText = summary.presentCount + summary.lateCount;
                    document.getElementById('stuAbsent').innerText = summary.absentCount;
                    
                    document.getElementById('academicProfile').style.display = 'block';
                    showToast(`Welcome back, ${summary.studentName}!`);
                } catch (error) {
                    showToast('Could not find attendance for this USN.', 'error');
                } finally {
                    btn.innerHTML = 'Load';
                }
            });
        });
    </script>
</body>
</html>
